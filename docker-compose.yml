services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  crypto-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-crypto_db}
    volumes:
      - crypto-db-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build: .
    image: crypto-etl-airflow:local
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      DB_HOST: crypto-db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-crypto_db}
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    command: >
      bash -c "airflow db migrate &&
      (airflow users create
      --username $${AIRFLOW_ADMIN_USERNAME:-admin}
      --password $${AIRFLOW_ADMIN_PASSWORD:-admin}
      --firstname Admin --lastname User --role Admin --email admin@example.com || true)"
    volumes: &airflow-common-volumes
      - ./dags:/opt/airflow/dags
      - ./app:/opt/airflow/app
      - ./main.py:/opt/airflow/main.py
      - ./logs:/opt/airflow/logs

  airflow-webserver:
    image: crypto-etl-airflow:local
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      crypto-db:
        condition: service_healthy
    environment: *airflow-common-env
    command: webserver
    ports:
      - "8080:8080"
    volumes: *airflow-common-volumes

  airflow-scheduler:
    image: crypto-etl-airflow:local
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      crypto-db:
        condition: service_healthy
    environment: *airflow-common-env
    command: scheduler
    volumes: *airflow-common-volumes

volumes:
  airflow-db-data:
  crypto-db-data:
